<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TV Wall</title>
  <!-- Samsung's own APIs, including the video player (AVPlay). Only exists on the display. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    html, body {
      margin: 0; width: 1920px; height: 1080px; overflow: hidden;
      background: transparent; /* the video plays on a layer below the page */
      color: #e8eaf0; font-family: "SamsungOne", "Samsung Sans", sans-serif;
    }
    #av { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

    #setup {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: #0e1014; font-size: 34px; text-align: center;
    }
    #setup h1 { margin: 0 0 40px; font-size: 56px; }
    #setup .number {
      display: inline-block; min-width: 2.2em; margin: 0 12px; padding: 4px 18px;
      border: 4px solid #6b8cff; border-radius: 16px; font-size: 140px; line-height: 1.1; font-weight: bold;
    }
    #setup .number.focused { background: #6b8cff; color: #fff; }
    #setup input {
      width: 520px; margin-left: 12px; padding: 10px 16px; font: inherit; color: inherit;
      background: #1d212a; border: 3px solid #2a2f3a; border-radius: 12px;
    }
    #setup input:focus { border-color: #6b8cff; outline: none; }
    #setup p { margin: 18px 0; }
    #setup .help { color: #8a91a1; font-size: 26px; }

    #message {
      position: absolute; left: 0; right: 0; bottom: 40px;
      text-align: center; font-size: 30px; text-shadow: 0 2px 6px #000;
    }
  </style>
</head>
<body>
  <object id="av" type="application/avplayer"></object>

  <div id="setup">
    <h1>TV Wall</h1>
    <p>This display is TV <span id="screen-number" class="number focused">1</span></p>
    <p class="help">Press its number on the remote, or ▲ ▼.</p>
    <p>Server <input id="server" type="text" spellcheck="false"></p>
    <p class="help">► to change the server address, ▲ to come back.<br>
      Press OK to start. Later, press the red A button to return here.</p>
  </div>

  <div id="message"></div>
  <script src="shell.js"></script>
</body>
</html>
