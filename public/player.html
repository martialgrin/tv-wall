<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Wall player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }

    /* Everything on screen lives in the stage, which turns as a whole for TVs mounted sideways. */
    #stage {
      position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh; overflow: hidden;
      -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
    }
    body.rot-90 #stage {
      width: 100vh; height: 100vw;
      -webkit-transform: translate(-50%, -50%) rotate(90deg); transform: translate(-50%, -50%) rotate(90deg);
    }
    body.rot-180 #stage {
      -webkit-transform: translate(-50%, -50%) rotate(180deg); transform: translate(-50%, -50%) rotate(180deg);
    }
    body.rot-270 #stage {
      width: 100vh; height: 100vw;
      -webkit-transform: translate(-50%, -50%) rotate(270deg); transform: translate(-50%, -50%) rotate(270deg);
    }

    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; visibility: hidden;
    }
    video.on { visibility: visible; }
    #overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .7); color: #fff;
      font: 700 28vmin/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #overlay.show { display: flex; }
    #hint {
      position: absolute; left: 3vmin; bottom: 3vmin; max-width: 80%;
      padding: 1.2vmin 2vmin; border-radius: 1vmin; display: none;
      background: rgba(0, 0, 0, .65); color: rgba(255, 255, 255, .85);
      font: 2.4vmin/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #hint.show { display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="a" playsinline muted preload="auto"></video>
    <video id="b" playsinline muted preload="auto"></video>
    <div id="overlay"></div>
    <div id="hint"></div>
  </div>
  <script src="/schedule.js"></script>
  <script src="/player.js"></script>
</body>
</html>
